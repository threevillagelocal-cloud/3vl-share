name: Photo copies (small WebP)
# Makes small copies of every photo threevillagelocal.com shows (see t/gen.py). Owner-approved 9/29/2026.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python t/gen.py
      - name: Save new copies
        run: |
          git config user.name "3vl-thumbs"
          git config user.email "actions@users.noreply.github.com"
          git add t
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Photo copies refresh"
          git pull -q --rebase --autostash
          git push -q
      - name: Copy new photo copies to files.threevillagelocal.com (Cloudflare)
        # 11/24/2026: the site moves off GitHub Pages; new copies go straight to Cloudflare as well
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q boto3
          python tools/r2_publish.py --src t --prefix share/t/
