name: Photo copies (small WebP)
# Makes small copies of every photo threevillagelocal.com shows (see t/gen.py). Owner-approved 9/29/2026.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python t/gen.py
      - name: Save new copies
        run: |
          git config user.name "3vl-thumbs"
          git config user.email "actions@users.noreply.github.com"
          git add t
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Photo copies refresh"
          git pull -q --rebase
          git push -q
